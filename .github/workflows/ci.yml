name: CI

on:
  push:
    branches: [prd]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unitarios + integración con Testcontainers (Postgres + LocalStack); Docker ya viene en el runner
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reportes-y-pdf-ejemplo
          path: |
            target/surefire-reports/
            target/factura-ejemplo.pdf

  imagen:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # El rol de AWS solo confía en jobs del environment `demo` (pide aprobación).
    # Variables AWS_ROLE_ARN, AWS_REGION y ECR_REPOSITORY: definidas en el environment.
    environment: demo
    permissions:
      contents: read
      id-token: write   # OIDC hacia AWS: sin access keys guardadas en GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Revisa CVEs de la imagen (SO + jars, incluido openhtmltopdf/PDFBox). Corta el pipeline si hay CRITICAL/HIGH con fix.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
